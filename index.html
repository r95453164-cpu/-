<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>для тебя ♡</title>
  <!-- Preload image so Stage 3 appears instantaneously -->
  <link rel="preload" as="image" href="https://i.pinimg.com/736x/d9/20/c7/d920c712c215ab2e969156759c27562b.jpg" />
  <!-- Google Fonts with full Cyrillic support -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    :root {
      --bg-void: #050507;
      --bg-glow: #0d0b10;
      --text-primary: #fff8f6;
      --text-secondary: #a8a2b3;
      --accent-rose: #fb7185;
      --accent-crimson: #f43f5e;
      --accent-gold: #fda4af;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
    }

    /* Subtle noise film grain for warm nocturnal texture */
    .film-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Ambient Rose Backlight that blooms in Stage 3 */
    .ambient-bloom {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.6s var(--ease-spring);
      background:
        radial-gradient(circle at 50% 44%, rgba(244, 63, 94, 0.14) 0%, rgba(251, 113, 133, 0.05) 36%, rgba(5, 5, 7, 0) 70%),
        radial-gradient(circle at 50% 80%, rgba(253, 164, 175, 0.06) 0%, transparent 55%);
    }

    .ambient-bloom.active {
      opacity: 1;
    }

    /* Shared Stage Wrapper */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
      transition: opacity 0.65s var(--ease-spring), transform 0.65s var(--ease-spring);
    }

    .stage-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    .stage-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* STAGE 1: Black screen with nearly imperceptible breathing point */
    #stage-black {
      cursor: pointer;
      background-color: var(--bg-void);
    }

    .seed-dot-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
    }

    .seed-dot {
      width: 5px;
      height: 5px;
      border-radius: 9999px;
      background-color: rgba(255, 248, 246, 0.32);
      box-shadow: 0 0 12px 2px rgba(251, 113, 133, 0.28);
      animation: seedPulse 3.2s ease-in-out infinite;
    }

    .seed-ring {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      border: 1px solid rgba(251, 113, 133, 0.14);
      animation: seedRingExpand 3.2s ease-out infinite;
    }

    @keyframes seedPulse {
      0%, 100% {
        opacity: 0.18;
        transform: scale(0.85);
      }
      50% {
        opacity: 0.55;
        transform: scale(1.15);
      }
    }

    @keyframes seedRingExpand {
      0% {
        opacity: 0;
        transform: scale(0.4);
      }
      40% {
        opacity: 0.25;
      }
      100% {
        opacity: 0;
        transform: scale(1.9);
      }
    }

    .whisper-hint {
      position: absolute;
      bottom: 12%;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      color: rgba(168, 162, 179, 0.24);
      opacity: 0;
      transition: opacity 1.5s ease;
      font-weight: 400;
      pointer-events: none;
    }

    .whisper-hint.show {
      opacity: 1;
    }

    /* Click Ripple Effect */
    .touch-ripple {
      position: fixed;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 113, 133, 0.45) 0%, rgba(251, 113, 133, 0) 70%);
      border: 1px solid rgba(251, 113, 133, 0.35);
      transform: translate(-50%, -50%) scale(0.2);
      pointer-events: none;
      z-index: 35;
      animation: rippleOut 0.85s var(--ease-spring) forwards;
    }

    @keyframes rippleOut {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(0.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(7.5);
      }
    }

    /* STAGE 2: Three Dots (...) */
    #stage-dots {
      cursor: pointer;
    }

    .dots-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 30px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 12px 40px -10px rgba(244, 63, 94, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .typing-dot {
      width: 11px;
      height: 11px;
      border-radius: 9999px;
      background: var(--text-primary);
      box-shadow: 0 0 16px rgba(251, 113, 133, 0.75);
      animation: dotWave 1.35s ease-in-out infinite;
    }

    .typing-dot:nth-child(1) {
      animation-delay: 0s;
    }
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotWave {
      0%, 60%, 100% {
        transform: translateY(0) scale(0.88);
        opacity: 0.38;
        background-color: #fff8f6;
      }
      30% {
        transform: translateY(-8px) scale(1.18);
        opacity: 1;
        background-color: var(--accent-rose);
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.95);
      }
    }

    /* STAGE 3: Image Card & Romantic Confession */
    .reveal-card-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 440px;
      z-index: 15;
    }

    .photo-frame {
      position: relative;
      padding: 10px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        0 22px 60px -15px rgba(244, 63, 94, 0.22),
        0 0 0 1px rgba(251, 113, 133, 0.06) inset;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translateY(18px) scale(0.94);
      opacity: 0;
      transition:
        transform 0.95s var(--ease-spring),
        opacity 0.95s var(--ease-spring),
        box-shadow 0.4s ease;
      cursor: pointer;
    }

    .stage-visible .photo-frame {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .photo-frame:hover {
      box-shadow:
        0 26px 70px -12px rgba(244, 63, 94, 0.32),
        0 0 0 1px rgba(251, 113, 133, 0.18) inset;
    }

    .photo-frame.hug-bounce {
      animation: hugPop 0.48s var(--ease-spring);
    }

    @keyframes hugPop {
      0% { transform: scale(1); }
      35% { transform: scale(0.96) rotate(-1deg); }
      70% { transform: scale(1.03) rotate(1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .photo-inner-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #0d0b10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confession-image {
      display: block;
      width: auto;
      max-width: min(330px, 80vw);
      max-height: 48dvh;
      object-fit: cover;
      border-radius: 16px;
      transition: transform 0.7s var(--ease-spring);
    }

    .photo-frame:hover .confession-image {
      transform: scale(1.025);
    }

    /* Subtle warm inner vignette over image */
    .photo-vignette {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      pointer-events: none;
      box-shadow: inset 0 0 28px rgba(5, 5, 7, 0.28);
      background: linear-gradient(to top, rgba(5, 5, 7, 0.22) 0%, transparent 32%);
    }

    /* Cute floating badge on corner of frame */
    .heart-badge {
      position: absolute;
      bottom: -10px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      background: rgba(18, 14, 22, 0.88);
      border: 1px solid rgba(251, 113, 133, 0.35);
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-rose);
      transition: transform 0.3s var(--ease-spring), background 0.3s ease;
      z-index: 5;
    }

    .photo-frame:hover .heart-badge {
      transform: scale(1.14) rotate(8deg);
      background: rgba(30, 18, 28, 0.95);
    }

    .heart-badge svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      filter: drop-shadow(0 0 6px rgba(251, 113, 133, 0.65));
      animation: heartBeat 2.4s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.22); }
      28% { transform: scale(0.95); }
      42% { transform: scale(1.15); }
      70% { transform: scale(1); }
    }

    /* Caption Block Below the Image */
    .caption-wrapper {
      margin-top: 26px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: 92vw;
    }

    .caption-line-1 {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.02rem, 2.8vw, 1.2rem);
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(12px);
      transition:
        opacity 0.8s var(--ease-spring) 0.25s,
        transform 0.8s var(--ease-spring) 0.25s;
    }

    .caption-line-2 {
      font-family: 'Comfortaa', cursive;
      font-size: clamp(1.28rem, 4vw, 1.72rem);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #fff8f6 10%, #fda4af 52%, #fb7185 95%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 18px rgba(244, 63, 94, 0.28));
      opacity: 0;
      transform: translateY(14px);
      transition:
        opacity 0.9s var(--ease-spring) 0.5s,
        transform 0.9s var(--ease-spring) 0.5s;
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    .stage-visible .caption-line-1,
    .stage-visible .caption-line-2 {
      opacity: 1;
      transform: translateY(0);
    }

    .inline-heart {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-rose);
      filter: drop-shadow(0 0 8px rgba(251, 113, 133, 0.6));
      animation: floatSoft 3s ease-in-out infinite;
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-3px) rotate(6deg); }
    }

    /* Ambient Background Floating Particles (Stage 3) */
    #particles-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }

    .ambient-particle {
      position: absolute;
      bottom: -30px;
      pointer-events: none;
      opacity: 0;
      animation: driftUp linear infinite;
    }

    @keyframes driftUp {
      0% {
        transform: translateY(0) translateX(0) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      18% {
        opacity: var(--max-op, 0.24);
      }
      82% {
        opacity: var(--max-op, 0.24);
      }
      100% {
        transform: translateY(-108dvh) translateX(var(--drift-x, 20px)) scale(1.08) rotate(22deg);
        opacity: 0;
      }
    }

    /* Interactive Burst Hearts on Tap in Stage 3 */
    .burst-heart {
      position: fixed;
      pointer-events: none;
      z-index: 30;
      color: var(--accent-rose);
      filter: drop-shadow(0 0 8px rgba(251, 113, 133, 0.55));
      animation: burstFly 1.25s var(--ease-spring) forwards;
    }

    @keyframes burstFly {
      0% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.25) rotate(var(--rot));
      }
    }

    /* Subtle Replay Button in Bottom Corner during Stage 3 */
    .replay-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 25;
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: rgba(168, 162, 179, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease 1.1s, color 0.25s ease, background 0.25s ease, transform 0.25s ease;
    }

    .replay-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .replay-btn:hover {
      color: var(--text-primary);
      background: rgba(251, 113, 133, 0.12);
      border-color: rgba(251, 113, 133, 0.28);
      transform: rotate(-35deg) scale(1.06);
    }
  </style>
</head>
<body>
  <!-- Subtle atmospheric grain -->
  <div class="film-grain"></div>

  <!-- Warm nocturnal rose backlight (activates on Stage 3) -->
  <div id="ambient-bloom" class="ambient-bloom"></div>

  <!-- Soft background floating hearts & bokeh particles (Stage 3) -->
  <div id="particles-layer"></div>

  <!-- STAGE 1: Just a black screen waiting for a tap -->
  <main id="stage-black" class="stage stage-visible" aria-label="Нажми на экран">
    <div class="seed-dot-wrap">
      <div class="seed-ring"></div>
      <div class="seed-dot"></div>
    </div>
    <span id="whisper-hint" class="whisper-hint">нажми</span>
  </main>

  <!-- STAGE 2: Three animated dots (...) after click -->
  <section id="stage-dots" class="stage stage-hidden" aria-label="Загрузка сообщения">
    <div class="dots-pill" role="status">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </section>

  <!-- STAGE 3: Image & Caption Underneath -->
  <section id="stage-reveal" class="stage stage-hidden" aria-live="polite">
    <div class="reveal-card-container">
      <!-- Polaroid / Glassmorphic Photo Frame -->
      <div id="photo-frame" class="photo-frame" title="Нажми ♡">
        <div class="photo-inner-wrap">
          <img
            id="confession-img"
            class="confession-image"
            src="https://i.pinimg.com/736x/d9/20/c7/d920c712c215ab2e969156759c27562b.jpg"
            alt="для тебя"
            draggable="false"
          />
          <div class="photo-vignette"></div>
        </div>
        <!-- Glowing corner heart badge -->
        <div class="heart-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>

      <!-- Caption Underneath -->
      <div class="caption-wrapper">
        <p class="caption-line-1">бля это тебе мне скучно</p>
        <p class="caption-line-2">
          <span>я тебя люблю любимость</span>
          <span class="inline-heart" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </span>
        </p>
      </div>
    </div>
  </section>

  <!-- Discreet replay button to re-watch from black screen -->
  <button id="replay-btn" class="replay-btn" title="Сначала" aria-label="Повторить сначала">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
  </button>

  <script>
    (function () {
      const stageBlack = document.getElementById('stage-black');
      const stageDots = document.getElementById('stage-dots');
      const stageReveal = document.getElementById('stage-reveal');
      const whisperHint = document.getElementById('whisper-hint');
      const ambientBloom = document.getElementById('ambient-bloom');
      const particlesLayer = document.getElementById('particles-layer');
      const photoFrame = document.getElementById('photo-frame');
      const replayBtn = document.getElementById('replay-btn');

      let currentStage = 1;
      let dotsTimer = null;
      let hintTimer = null;
      let particlesCreated = false;

      // Preload target image in memory
      const preloadImg = new Image();
      preloadImg.src = 'https://i.pinimg.com/736x/d9/20/c7/d920c712c215ab2e969156759c27562b.jpg';

      // Show a super faint hint if user hasn't clicked after 3.2 seconds
      function scheduleHint() {
        clearTimeout(hintTimer);
        whisperHint.classList.remove('show');
        hintTimer = setTimeout(() => {
          if (currentStage === 1) {
            whisperHint.classList.add('show');
          }
        }, 3200);
      }
      scheduleHint();

      // Spawn a subtle rose ripple at tap coordinates
      function spawnRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'touch-ripple';
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 900);
      }

      // Transition from Stage 1 (Black) -> Stage 2 (Three Dots)
      function goToDots(e) {
        if (currentStage !== 1) return;
        currentStage = 2;
        clearTimeout(hintTimer);

        const x = e && e.clientX ? e.clientX : window.innerWidth / 2;
        const y = e && e.clientY ? e.clientY : window.innerHeight / 2;
        spawnRipple(x, y);

        stageBlack.classList.replace('stage-visible', 'stage-hidden');
        stageDots.classList.replace('stage-hidden', 'stage-visible');

        // Automatically transition to Stage 3 after 2.2 seconds of cute typing dots
        clearTimeout(dotsTimer);
        dotsTimer = setTimeout(() => {
          goToReveal();
        }, 2200);
      }

      // Transition from Stage 2 (Three Dots) -> Stage 3 (Image & Text)
      function goToReveal() {
        if (currentStage !== 2) return;
        currentStage = 3;
        clearTimeout(dotsTimer);

        stageDots.classList.replace('stage-visible', 'stage-hidden');
        stageReveal.classList.replace('stage-hidden', 'stage-visible');
        ambientBloom.classList.add('active');
        replayBtn.classList.add('visible');

        if (!particlesCreated) {
          initAmbientParticles();
          particlesCreated = true;
        }
      }

      // Stage 1 click/tap handler
      stageBlack.addEventListener('pointerdown', (e) => {
        goToDots(e);
      });

      // Allow clicking on Stage 2 dots to advance smoothly if tapped manually
      stageDots.addEventListener('pointerdown', (e) => {
        spawnRipple(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
        goToReveal();
      });

      // Stage 3: Tapping the photo spawns floating mini-hearts & a gentle hug bounce
      photoFrame.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        photoFrame.classList.remove('hug-bounce');
        void photoFrame.offsetWidth; // trigger reflow
        photoFrame.classList.add('hug-bounce');

        const rect = photoFrame.getBoundingClientRect();
        const originX = e.clientX || (rect.left + rect.width / 2);
        const originY = e.clientY || (rect.top + rect.height / 2);
        spawnHeartBurst(originX, originY, 7);
      });

      // Also allow tapping anywhere in Stage 3 background for subtle mini hearts
      stageReveal.addEventListener('pointerdown', (e) => {
        if (e.target.closest('#photo-frame') || e.target.closest('#replay-btn')) return;
        spawnHeartBurst(e.clientX, e.clientY, 4);
      });

      // Create a burst of floating hearts on tap
      function spawnHeartBurst(x, y, count = 6) {
        for (let i = 0; i < count; i++) {
          const heart = document.createElement('div');
          heart.className = 'burst-heart';
          const size = 12 + Math.random() * 12;
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
          const distance = 45 + Math.random() * 75;
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance - 25;
          const rot = (Math.random() - 0.5) * 50;

          heart.style.left = `${x}px`;
          heart.style.top = `${y}px`;
          heart.style.setProperty('--tx', `${tx}px`);
          heart.style.setProperty('--ty', `${ty}px`);
          heart.style.setProperty('--rot', `${rot}deg`);

          heart.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>`;

          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 1250);
        }
      }

      // Create 11 slow-drifting bokeh & micro-heart particles in Stage 3 background
      function initAmbientParticles() {
        const total = 11;
        for (let i = 0; i < total; i++) {
          const el = document.createElement('div');
          el.className = 'ambient-particle';
          const isHeart = i % 2 === 0;
          const left = 6 + Math.random() * 88;
          const duration = 11 + Math.random() * 10;
          const delay = Math.random() * 7;
          const driftX = (Math.random() - 0.5) * 60;
          const maxOp = (0.14 + Math.random() * 0.18).toFixed(2);

          el.style.left = `${left}%`;
          el.style.animationDuration = `${duration}s`;
          el.style.animationDelay = `${delay}s`;
          el.style.setProperty('--drift-x', `${driftX}px`);
          el.style.setProperty('--max-op', maxOp);

          if (isHeart) {
            const size = 10 + Math.floor(Math.random() * 8);
            el.style.color = i % 4 === 0 ? '#fda4af' : '#fb7185';
            el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>`;
          } else {
            const dotSize = 4 + Math.floor(Math.random() * 5);
            el.style.width = `${dotSize}px`;
            el.style.height = `${dotSize}px`;
            el.style.borderRadius = '9999px';
            el.style.background = 'rgba(253, 164, 175, 0.65)';
            el.style.filter = 'blur(1px)';
          }

          particlesLayer.appendChild(el);
        }
      }

      // Replay from Stage 1 (Black screen)
      replayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        clearTimeout(dotsTimer);
        currentStage = 1;
        replayBtn.classList.remove('visible');
        ambientBloom.classList.remove('active');
        stageReveal.classList.replace('stage-visible', 'stage-hidden');
        stageDots.classList.replace('stage-visible', 'stage-hidden');
        stageBlack.classList.replace('stage-hidden', 'stage-visible');
        scheduleHint();
      });
    })();
  </script>
</body>
</html>
